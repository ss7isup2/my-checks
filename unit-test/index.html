<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리FIS 통합상담 문서</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/docs.css" />
  </head>
  <body>
    <aside class="side">
      <strong>우리FIS 통합상담</strong>
      <a href="01-react-build-process.html" target="doc" aria-current="page">작성 과정</a>
      <a href="02-screen-modules.html" target="doc">모듈 설명</a>
      <a href="03-css-guide.html" target="doc">CSS 설명</a>
      <a href="04-css-react-learning.html" target="doc">학습 방법</a>
    </aside>
    <main class="viewer">
      <iframe name="doc" src="01-react-build-process.html" title="문서"></iframe>
    </main>
    <script>
      const links = document.querySelectorAll('.side a')
      links.forEach((link) => {
        link.addEventListener('click', () => {
          links.forEach((item) => item.removeAttribute('aria-current'))
          link.setAttribute('aria-current', 'page')
        })
      })
    </script>
  </body>
</html>
